name: Update GitHub Stats Snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: github-stats-snapshot-update
  cancel-in-progress: false

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    env:
      GITHUB_USERNAME: RR0327
      GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
      GITHUB_API_BASE_URL: https://api.github.com
      GITHUB_API_VERSION: "2022-11-28"
      GITHUB_CONTRIBUTIONS_URL: "https://github.com/users/{username}/contributions?from={from_date}&to={to_date}"
      GITHUB_TIMEZONE: Asia/Dhaka

      PRIMARY_STATS_URL: "https://github-readme-stats.vercel.app/api?username={username}&show_icons=true&rank_icon=github&include_all_commits=true&count_private=true&cache_seconds=1800"
      PRIMARY_STREAK_URL: "https://streak-stats.demolab.com?user={username}&disable_animations=true"
      PRIMARY_LANGUAGES_URL: "https://github-readme-stats.vercel.app/api/top-langs/?username={username}&layout=compact&cache_seconds=1800"

      PRIMARY_TIMEOUT_SECONDS: "7"
      BACKUP_TIMEOUT_SECONDS: "15"
      MAX_IMAGE_BYTES: "2000000"
      MAX_REPOSITORIES: "50"
      LANGUAGE_CONCURRENCY: "8"
      INCLUDE_FORKS: "false"
      STREAK_LOOKBACK_DAYS: "400"
      LIVE_DATA_CACHE_SECONDS: "900"

      SUCCESS_CACHE_SECONDS: "1800"
      SNAPSHOT_CACHE_SECONDS: "21600"
      STALE_WHILE_REVALIDATE_SECONDS: "86400"

      FALLBACK_DIRECTORY: assets/fallback
      USER_AGENT: RR0327-GitHub-Stats-Failover/3.0
      LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate fresh SVG snapshots
        run: python scripts/generate_snapshots.py

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fallback/stats.svg
          git add assets/fallback/streak.svg
          git add assets/fallback/languages.svg

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh GitHub stats snapshots"
          git push
